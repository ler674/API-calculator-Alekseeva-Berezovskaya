# CI-пайплайн для API-калькулятора.

# Используемые инструменты безопасности:
# - Semgrep: статический анализ кода
# - pip-audit: поиск уязвимостей в Python-зависимостях
# - Gitleaks: поиск утечек секретов и паролей
# - Hadolint: линтер для Dockerfile
# - Checkov: сканер конфигураций
# - Trivy: сканирование готового Docker-образа

name: CI calculator Alekseeva Berezovskaya

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]        # запуск при пуше тега, например v1.0.0
  pull_request:
    branches: [ "main" ]

# Переменные окружения, доступные во всех шагах пайплайна
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}    # полное имя репозитория: владелец/имя

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Получение кода
      - name: Checkout repository
        uses: actions/checkout@v4

      # Установка Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Установка зависимостей
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Запуск тестов
      - name: Run pytest
        run: python -m pytest tests/ -v

  # Статический анализ кода
  # Поиск наличия уязвимостей в коде Python
  # Semgrep - мультиъязычный
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      # Получение кода
      - name: Checkout repository
        uses: actions/checkout@v4

      # Запуск анализа
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          # Официальные правила для Python и безопасности
          config: >-
            p/python
            p/security-audit
            p/owasp-top-ten
        env:
          SEMGREP_ARGS: "--error"

  # Bandit - только для Python
  sast-bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    steps:
      # Получение кода
      - name: Checkout repository
        uses: actions/checkout@v4

       # Установка Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Установка Bandit
      - name: Install Bandit
        run: pip install bandit

      # Запуск анализа
      - name: Run Bandit
        run: bandit -r calculator/ -ll

  # Поиск секретов
  # Проверка наличия в коде паролей, API-ключей или токенов
  secrets-gitleaks:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest

    steps:
      # Получение кода
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 скачивает всю историю коммитов.
          # Без этого Gitleaks проверит только последний коммит.
          fetch-depth: 0

      # Поиск секретов
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Анализ Dockerfile
  # Проверка Dockerfile на ошибки
  dockerfile-hadolint:
    name: Dockerfile - Hadolint
    runs-on: ubuntu-latest

    steps:
      # Получение кода
      - name: Checkout repository
        uses: actions/checkout@v4

      #Проверка Dockerfile
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  # Сканирование образа Trivy
  # Начинается только если все проверки прошли успешно
  scan:
    name: Scan Image - Trivy
    # Ожидание успешного завершения всех проверок кода
    needs: [test, sast-semgrep, sast-bandit, secrets-gitleaks, dockerfile-hadolint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      # Получение кода
      - name: Checkout repository
        uses: actions/checkout@v4

      # Настройка Docker Buildx для сборки образов
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Локальная сборка образа, чтобы Trivy мог его просканировать
      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: calculator:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Запуск Trivy на поиск критических уязвимостей
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'calculator:scan'
          format: 'table'
          severity: 'MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

  build-and-push:
    # Запускается только после успешного сканирования
    needs: [scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Получение кода
      - name: Checkout repository
        uses: actions/checkout@v4

      # Настройка Docker Buildx для сборки образов
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Логин в GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Автоматическое формирование тегов образа
      # При пуше в main: теги main и sha-
      # При пуше тега v1.0.0: теги 1.0.0, 1.0 и latest
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      # Сборка и публикация образа
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max